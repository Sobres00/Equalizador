name: Compilar Anne Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android 16
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generar Clave de Firma y Recursos Visuales
        run: |
          chmod +x gradlew || true
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # Generar certificado de firma oficial v1/v2/v3 para evitar bloqueo en Android 16
          keytool -genkeypair -v \
            -keystore anne-release.keystore \
            -alias anne \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass anneassistant \
            -keypass anneassistant \
            -dname "CN=Anne Assistant, OU=AI, O=Anne, L=Global, ST=Global, C=ES"

          # Recursos de cadenas requeridos
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Anne Asistente</string>
              <string name="accessibility_service_description">Permite a Anne asistir en la lectura de pantalla y toques de confirmación para WhatsApp y documentos.</string>
          </resources>
          EOF

          # Tema Material / AppCompat para evitar cierres inesperados en Android 16
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AnneAssistant" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#6366F1</item>
                  <item name="colorPrimaryVariant">#4F46E5</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:navigationBarColor">#0F172A</item>
                  <item name="android:windowBackground">#0F172A</item>
              </style>
          </resources>
          EOF

      - name: Compilar APKs con Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon

      - name: Subir APK Compilado
        uses: actions/upload-artifact@v4
        with:
          name: Anne-Assistant-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
