name: Compilar Anne Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android 16
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Permisos y Recursos de Android
        run: |
          chmod +x gradlew || true
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # Asegurar que strings.xml contenga todas las cadenas requeridas por el servicio de accesibilidad
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Anne Asistente</string>
              <string name="accessibility_service_description">Permite a Anne asistir en la lectura de pantalla y toques de confirmación para WhatsApp y documentos.</string>
          </resources>
          EOF

      - name: Compilar APK con Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Subir APK Compilado
        uses: actions/upload-artifact@v4
        with:
          name: Anne-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
